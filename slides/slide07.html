<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 07 — Prioritize risks on a likelihood × impact matrix</title>
<link rel="stylesheet" href="../css/slide07.css">

<!--
  SPEAKER NOTES (from PPTX):
  Risk assessment is the systematic process of identifying, analyzing and evaluating potential risks. A nine-cell matrix rates likelihood against impact: high-probability, high-impact risks such as annual flooding take priority; rare-but-severe risks call for insurance and contingency arrangements. The register is a living document, updated as threats evolve.
-->
</head>
<body>
<main class="stage">
  <section class="slide">
    <h1 class="slide-title">Prioritize risks on a likelihood × impact matrix</h1>
    <div class="mx-zone">
    <figure class="figure figure--mx">
      <div class="mx-card">
        <div class="mx-grid">
          <div class="mx-axis">Impact →</div>
          <div class="mx-cell mx-y"><b>Likely × Moderate</b><span>Plan retrofits and budget reserves</span></div>
          <div class="mx-cell mx-r"><b>Likely × Major</b><span>Priority: lifeline strengthening, land-use controls</span></div>
          <div class="mx-cell mx-r"><b>Likely × Severe</b><span>Act now: retrofit programs, early warning, drills</span></div>
          <div class="mx-axis">←</div>
          <div class="mx-cell mx-g"><b>Occasional × Moderate</b><span>Monitor; update the risk register annually</span></div>
          <div class="mx-cell mx-y"><b>Occasional × Major</b><span>Mitigation plans with named owners</span></div>
          <div class="mx-cell mx-r"><b>Occasional × Severe</b><span>Insurance + emergency preparedness</span></div>
          <div class="mx-axis">←</div>
          <div class="mx-cell mx-g"><b>Rare × Moderate</b><span>Watch list</span></div>
          <div class="mx-cell mx-g"><b>Rare × Major</b><span>Contingency arrangements</span></div>
          <div class="mx-cell mx-y"><b>Rare × Severe</b><span>Business continuity, mutual aid</span></div>
          <div class="mx-lab">Likelihood</div>
          <div class="mx-cell mx-x">Lower</div>
          <div class="mx-cell mx-x">Rising</div>
          <div class="mx-cell mx-x">Higher</div>
        </div>
        <p class="mx-note">Nine-cell matrix: rate each risk by likelihood and impact, then act on the red cells first — the discipline behind a municipal risk register.</p>
      </div>
      <figcaption>Risk prioritization matrix — likelihood × impact (after standard municipal risk-management practice).</figcaption>
    </figure>
    <p class="link-note mx-link-note">Rate each risk by likelihood and impact, act on red cells first, and keep the register alive — reviewed annually and after every significant incident.</p>
  </section>
</main>
