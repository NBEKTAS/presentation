<title>Slide 13 — Validate readiness before the earthquake occurs</title>

<!--
  SPEAKER NOTES (from PPTX):
  Crisis management prepares the municipality to respond when risks materialize. A well-developed emergency response plan assigns roles, communication protocols and resources; a crisis communication plan designates spokespeople and multi-channel alerts; an Incident Command System streamlines inter-agency decisions; and regular drills rehearse roles and expose weaknesses before a real event.
-->
</head>
<body>
<main class="stage">
  <section class="slide">
    <h1 class="slide-title">Validate readiness before the earthquake occurs</h1>
    <div class="ck-zone">
    <figure class="figure figure--ck">
      <div class="ck-card">
        <div class="ck-group">
          <h3>Emergency Response Plan</h3>
          <ul>
            <li>Roles and responsibilities defined across departments</li>
            <li>Scenario playbooks for the priority risks in the register</li>
            <li>Coordination with regional and state emergency services</li>
          </ul>
        </div>
        <div class="ck-group">
          <h3>Crisis Communication</h3>
          <ul>
            <li>Designated spokespeople and backup contacts</li>
            <li>Multi-channel alerts: SMS, social media, local media</li>
            <li>Pre-approved message templates for fast release</li>
          </ul>
        </div>
        <div class="ck-group">
          <h3>Incident Command System</h3>
          <ul>
            <li>Standard ICS structure adopted across agencies</li>
            <li>Staff trained in ICS roles and decision thresholds</li>
            <li>Clear escalation and handover procedures</li>
          </ul>
        </div>
        <div class="ck-group">
          <h3>Drills and Training</h3>
          <ul>
            <li>Annual or semi-annual multi-agency exercises</li>
            <li>After-action reviews feeding the risk register</li>
            <li>Recovery pre-planning: Build Back Better criteria</li>
          </ul>
        </div>
      </div>
      <figcaption>Crisis-readiness checklist — preparedness validated through practice, not paperwork alone.</figcaption>
    </figure>
    <p class="link-note ck-link-note">Preparedness is validated through practice: response plans, crisis communication, incident command and regular drills keep the municipality ready to act.</p>
  </section>
</main>
